<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aksoy City" />
    <meta name="theme-color" content="#9fd8f0" />
    <title>Aksoy City</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <header id="top">
      <div class="pill" id="lvl"><span class="star">⭐<b id="lvl-v">1</b></span><span class="bar"><i id="xp-bar"></i></span></div>
      <div class="pill" id="money">💰 <b id="money-v">0</b><small id="income-v"></small></div>
      <div class="pill">👥 <b id="pop-v">0</b></div>
      <span class="spacer"></span>
      <button class="pill icon" id="sound" aria-label="Ses">🔊</button>
      <button class="pill icon" id="reset" aria-label="Yeni şehir">🗑️</button>
    </header>
    <div id="utils">
      <div class="pill" id="power">⚡ <b id="power-v">0/0</b></div>
      <div class="pill" id="water">💧 <b id="water-v">0/0</b></div>
      <button class="pill" id="storage">📦 <b id="storage-v">0/20</b></button>
    </div>

    <div id="cam">
      <button class="pill icon" id="rot-left" aria-label="Sola döndür">↺</button>
      <button class="pill icon" id="rot-right" aria-label="Sağa döndür">↻</button>
    </div>

    <div id="chip" hidden></div>
    <div id="toast"></div>
    <div id="submenu" hidden></div>
    <div id="info" hidden></div>
    <nav id="tools"></nav>

    <div id="levelup" hidden>
      <div class="box">
        <h2></h2>
        <p class="reward"></p>
        <p class="unlocks"></p>
        <button>Harika!</button>
      </div>
    </div>

    <div id="loading">Aksoy City yükleniyor…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
