<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent YAPMAYIN: iOS 26+ saydam istenen saat şeridine Liquid Glass bulanıklık bandı çiziyor (iOS 27'de
         ekranın üstü bulanık). default ile şerit opak olur ve rengini en üstteki sabit kutunun düz rengi (#statusbar)
         verir. iOS bu etiketi yalnızca ana ekrana EKLERKEN okur: değişince uygulama silinip yeniden eklenmeli. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aksoy City" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4f9a35" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Aksoy City</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Üst bilgi: seviye, nüfus, para -->
    <header id="hud">
      <button id="lvl" aria-label="Şehir seviyesi" title="Şehir seviyesi">
        <span class="lvl-star"><span data-icon="star"></span><b id="lvl-v">1</b></span>
        <span class="lvl-info"><small id="city-name">Aksoy City</small><span class="xp"><i id="xp-bar"></i></span></span>
      </button>
      <button id="pop" class="cap" aria-label="Nüfus" title="Nüfus"><span class="cap-ic" data-icon="people"></span><b id="pop-v">0</b></button>
      <span class="spacer"></span>
      <button id="money" class="cap money" aria-label="Bütçe" title="Bütçe">
        <span class="cap-ic" data-icon="coin"></span>
        <span class="mv"><b id="money-v">0</b><small id="income-v"></small></span>
      </button>
    </header>

    <!-- Elektrik, su ve mutluluk -->
    <div id="res">
      <button id="power" class="seg" aria-label="Elektrik" title="Elektrik: kullanılan / üretilen"><span class="seg-ic" data-icon="bolt"></span><b id="power-v">0/0</b></button>
      <button id="water" class="seg" aria-label="Su" title="Su: kullanılan / üretilen"><span class="seg-ic" data-icon="drop"></span><b id="water-v">0/0</b></button>
      <button id="happy" class="seg" aria-label="Mutluluk" title="Mutluluk"><span class="seg-ic" data-icon="smile"></span><b id="happy-v">%0</b></button>
      <button id="clock" class="seg" aria-label="Gün" title="Gün"><span class="seg-ic" id="clock-ic" data-icon="sun"></span><b id="day-v">1</b></button>
    </div>

    <!-- Sağ kenar düğmeleri -->
    <div id="side">
      <button id="quests" class="rbtn" aria-label="Görevler" title="Görevler"><span data-icon="quests"></span><span id="quests-badge" class="badge" hidden>0</span></button>
      <button id="ach" class="rbtn" aria-label="Başarımlar" title="Başarımlar"><span data-icon="trophy"></span><span id="ach-badge" class="badge" hidden>0</span></button>
      <button id="storage" class="rbtn" aria-label="Depo" title="Depo"><span data-icon="box"></span><small id="storage-v" class="rlabel">0/20</small></button>
      <button id="metro-btn" class="rbtn" aria-label="Metro haritası" title="Metro haritası (yeraltı)" hidden><span class="emo">🚇</span><small class="rlabel">Metro</small></button>
      <button id="settings" class="rbtn" aria-label="Ayarlar" title="Ayarlar"><span data-icon="gear"></span></button>
    </div>

    <!-- Pusula: harita iki parmakla döndürülür; pusulaya dokununca ilk açıya döner -->
    <div id="cam">
      <button id="compass" class="rbtn" aria-label="Kuzeye çevir" title="İlk açıya ve eğime dön (bilgisayarda: orta tuşla sürükle = döndür ve eğ; Q/E döndür, R/F eğ)"><span class="needle" data-icon="compass"></span><small class="rlabel">Pusula</small></button>
      <button id="photo" class="rbtn" aria-label="Fotoğraf modu" title="Fotoğraf modu: arayüzü gizle, şehrin fotoğrafını çek"><span data-icon="camera"></span><small class="rlabel">Fotoğraf</small></button>
    </div>

    <!-- Ana düğmeler: yık ve inşa et -->
    <div id="actions">
      <button id="bulldoze" class="abtn red" aria-label="Yık" title="Yık"><span data-icon="bulldozer"></span><em>Yık</em></button>
      <button id="build" class="abtn big" aria-label="İnşa et" title="İnşa et"><span data-icon="build"></span><em>İnşa Et</em></button>
    </div>

    <!-- Seçili araç çubuğu -->
    <div id="mode" hidden>
      <span class="mode-pic"></span>
      <span class="mode-txt"><b></b><small></small></span>
      <button class="mode-done"><span data-icon="check"></span>Tamam</button>
    </div>

    <!-- İnşa paneli -->
    <section id="catalog" hidden>
      <button class="cat-close" aria-label="Kapat"><span data-icon="close"></span></button>
      <div class="tabs"></div>
      <div class="cards"></div>
      <button class="cat-arrow left" aria-label="Sola kaydır">‹</button>
      <button class="cat-arrow right" aria-label="Sağa kaydır">›</button>
    </section>
    <div id="vignette"></div>
    <div id="statusbar"></div>

    <div id="chip" hidden></div>
    <div id="toast"></div>
    <div id="info" hidden></div>
    <div id="levelup" hidden></div>
    <div id="dialog" hidden></div>

    <div id="loading">
      <div class="load-sky">
        <div class="load-logo"><span>Aksoy</span><b>City</b></div>
        <div class="load-bar"><i id="load-bar"></i></div>
        <small id="load-text">Şehir yükleniyor…</small>
      </div>
      <svg class="load-skyline" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <path fill="#3f8fc9" d="M0 120V70h22V48h18v22h14V30h26v40h12V56h20v64zM112 120V40h10V22h14v18h10v80zM156 120V62h30v-14h22v72zM212 120V34l18-12 18 12v86zM256 120V58h16V44h24v76zM304 120V26h28v94zM340 120V64h20V50h18v14h22v56z"/>
        <path fill="#2b74ab" d="M0 120V92h40V80h30v40zM70 120V86h44v34zM120 120V96h30V84h36v36zM190 120V90h40v30zM236 120V82h24V70h30v50zM296 120V94h46v26zM346 120V84h54v36z"/>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
